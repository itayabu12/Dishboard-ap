<!doctype html>
<html lang="he" dir="rtl">
<head>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dishboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<!-- הגדרות PWA ואייקון -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff7e67">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dishboard">
<link rel="apple-touch-icon" href="icon.png?v=2">
</head>
<body>
<a class="skip" href="#main" id="skip"></a>
<header style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; width: 100%; margin-bottom: 1rem;">
    
    <!-- עמודה 1 (צד ימין): כפתור ההגדרות -->
    <div style="display: flex; justify-content: flex-start;">
      <button type="button" id="sb" class="btn alt"></button>
    </div>

    <!-- עמודה 2 (אמצע בדיוק): הלוגו המעוצב -->
    <a href="#" id="brand" style="font-family: 'Frank Ruhl Libre', serif; font-size: 2rem; font-weight: 900; text-decoration: none; color: var(--primary, #355a3a); text-align: center;">Dishboard</a>

    <!-- עמודה 3 (צד שמאל): כפתור הנגישות -->
    <div style="display: flex; justify-content: flex-end;">
      <button type="button" id="ab" class="btn alt"></button>
    </div>
    
  </header>
<main id="main" tabindex="-1"></main>
<nav class="tabs" id="tabs"></nav>

<!-- טעינת Supabase והקבצים שלנו -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
<script src="app.js"></script>
</body>
</html>
